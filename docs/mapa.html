<style>
/* Lienzo de flujo (estilo editor de nodos): barra superior, lienzo con retícula de puntos, panel de detalle lateral. Tema oscuro único, deliberado. */
:root {
  color-scheme: dark;
  --bg: #0e1116;
  --dot: #252b36;
  --panel: #151a22;
  --node: #1a2029;
  --node-hi: #212834;
  --line: #2b3240;
  --fg: #e7ebf2;
  --muted: #98a2b3;
  --faint: #5f6a7c;
  --edge: #4a5568;
  --c-trigger: #f2994a;
  --c-config: #94a3b8;
  --c-orch: #a78bfa;
  --c-source: #4ea8ff;
  --c-storage: #2ec4a6;
  --c-process: #ff8a65;
  --c-snap: #ffd166;
  --c-tool: #56d4e8;
  --c-user: #f8fafc;
  --c-head: #ff6b6b;
  --c-macro: #7c9cff;
  --c-fin: #5ee08f;
  --c-staff: #f472b6;
  --c-out: #cbd5e1;
  --f-ui: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); overflow: hidden; }
* { box-sizing: border-box; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

/* barra superior */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; padding-inline: 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: relative; z-index: 5; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 15px; font-weight: 700; letter-spacing: .02em; margin: 0; }
.brand span { font-size: 12px; color: var(--muted); }
.flows { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.flows .lbl { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; margin-right: 2px; }
.chip { font: 500 12px var(--f-ui); color: var(--fg); background: var(--node); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip:focus-visible, .zbtn:focus-visible, .node:focus-visible, .close:focus-visible { outline: 2px solid var(--c-tool); outline-offset: 2px; }

/* lienzo */
.stage { position: relative; overflow: hidden; cursor: grab; touch-action: none;
  background-color: var(--bg); }
/* reticula en su propia capa: al mover solo se traslada, no se repinta */
.dots { position: absolute; inset: -64px; pointer-events: none; will-change: transform;
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size: 22px 22px; }
.stage.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.stage.moving .world { will-change: transform; }
.stage.moving .node { transition: none; }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

.group { position: absolute; border: 1px dashed #323a48; border-radius: 14px; background: rgba(255,255,255,.012); }
.group > b { position: absolute; top: -11px; left: 14px; padding: 2px 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); background: var(--bg); border-radius: 6px; }
.group > b em { font-style: normal; color: var(--faint); margin-right: 6px; font-family: var(--f-mono); }

.node { position: absolute; width: 210px; min-height: 64px; display: flex; gap: 10px; align-items: center; padding: 10px 12px 10px 10px;
  background: var(--node); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,.28); transition: opacity .18s, border-color .18s, background .18s; }
.node:hover { background: var(--node-hi); border-color: var(--k); }
.node.sel { border-color: var(--k); box-shadow: 0 0 0 2px color-mix(in srgb, var(--k) 45%, transparent); }
.node.big { width: 230px; min-height: 76px; }
.node .ic { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--k) 16%, var(--node)); color: var(--k); border: 1px solid color-mix(in srgb, var(--k) 40%, transparent); }
.node .ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.node .tx { min-width: 0; display: grid; gap: 3px; }
.node .tx b { font-size: 13px; font-weight: 600; line-height: 1.2; }
.node .tx span { font-size: 11px; line-height: 1.3; color: var(--muted); }
.node .tag { position: absolute; top: -9px; right: 10px; font: 500 10px var(--f-mono); color: var(--bg); background: var(--k);
  padding: 1px 6px; border-radius: 5px; }
.port { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--k); }
.port.l { left: -6px; top: calc(50% - 5px); } .port.r { right: -6px; top: calc(50% - 5px); }

.dim .node:not(.on) { opacity: .22; }
.dim .group { opacity: .5; }

path.e { fill: none; stroke: var(--edge); stroke-width: 1.8; }
path.e.dash { stroke-dasharray: 5 5; }
path.e.on { stroke: var(--hc, var(--fg)); stroke-width: 2.4; }
.dim path.e:not(.on) { opacity: .12; }
path.flow { fill: none; stroke: var(--hc, var(--fg)); stroke-width: 2.4; stroke-dasharray: 2 14; stroke-linecap: round; display: none; }
/* solo se animan las conexiones del recorrido activo, y se pausan mientras mueves el lienzo */
path.flow.on { display: inline; opacity: .95; animation: run 1s linear infinite; }
.stage.moving path.flow.on { animation-play-state: paused; }
@keyframes run { to { stroke-dashoffset: -16; } }
.elabel { font: 500 10px var(--f-mono); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.dim .elabel:not(.on) { opacity: .15; }

/* zoom */
.zoom { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 4; }
.zbtn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font: 600 16px var(--f-ui); cursor: pointer; display: grid; place-items: center; }
.zbtn.wide { width: auto; padding: 0 12px; font-size: 12px; }
.hint { position: absolute; right: 16px; bottom: 18px; font-size: 11px; color: var(--faint); z-index: 4; }

/* leyenda */
.legend { position: absolute; left: 16px; top: 14px; z-index: 4; display: flex; flex-wrap: wrap; gap: 6px 12px; max-width: calc(100% - 32px);
  font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 12px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; background: var(--k); margin-right: 6px; }

/* panel */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--panel); border-left: 1px solid var(--line);
  z-index: 6; padding-block: 20px; padding-inline: 20px; overflow-y: auto; transform: translateX(102%); transition: transform .25s ease; }
.drawer.open { transform: none; }
.drawer .k { display: flex; align-items: center; gap: 10px; }
.drawer .k .ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--k) 16%, var(--node)); color: var(--k); border: 1px solid color-mix(in srgb, var(--k) 40%, transparent); }
.drawer .k .ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.drawer .cat { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--k); }
.drawer h2 { font-size: 18px; margin: 2px 0 0; text-wrap: balance; }
.drawer p { font-size: 13px; line-height: 1.6; color: #c9d0dc; max-width: 62ch; }
.drawer h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 18px 0 8px; }
.drawer ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; line-height: 1.5; color: #c9d0dc; }
.drawer ol { margin: 0; padding-left: 20px; display: grid; gap: 7px; font-size: 13px; line-height: 1.5; color: #c9d0dc; }
.drawer code { font-family: var(--f-mono); font-size: 12px; color: var(--c-tool); background: #0f141b; border: 1px solid var(--line);
  padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
.drawer .links { display: flex; flex-wrap: wrap; gap: 6px; }
.drawer .links button { font: 500 12px var(--f-ui); color: var(--fg); background: var(--node); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
.close { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--node); color: var(--fg); cursor: pointer; font-size: 16px; }

@media (max-width: 640px) {
  .brand span { display: none; }
  .legend { display: none; }
  .hint { display: none; }
  .drawer { top: auto; height: 62%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
    transform: translateY(104%); }
}
@media (prefers-reduced-motion: reduce) {
  path.flow { animation: none; stroke-dasharray: none; }
  .drawer, .node { transition: none; }
}
</style>

    staff: ["Staff", "--c-staff"], out: ["Entregable", "--c-out"],
  };

  const $ = (s) => document.querySelector(s);
  const world = $("#world"), svg = $("#edges"), stage = $("#stage"), dots = $("#dots");
  const drawer = $("#drawer"), dbody = $("#dbody");
  const svgNS = "http://www.w3.org/2000/svg";
  const byId = Object.fromEntries(N.map((n) => [n.id, n]));
  const icon = (k) => `<svg viewBox="0 0 24 24">${ICONS[k] || ICONS.gear}</svg>`;
  const nodeEl = {};
  const geo = {};  // posicion y tamano de cada nodo en el lienzo (se mide una vez)
  const adj = {};  // vecinos y conexiones por nodo
  const W = Math.max(...GROUPS.map((g) => g.x + g.w), ...N.map((n) => n.x + 230)) + 20;
  const H = Math.max(...GROUPS.map((g) => g.y + g.h), ...N.map((n) => n.y + 80)) + 20;
  world.style.width = W + "px"; world.style.height = H + "px";
  svg.style.width = W + "px"; svg.style.height = H + "px";

  // ---------------------------------------------------------------- construccion (una sola vez)
  const frag = document.createDocumentFragment();
  for (const g of GROUPS) {
    const el = document.createElement("div");
    el.className = "group";
    el.style.cssText = `left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px`;
    el.innerHTML = `<b><em>${g.n}</em>${g.t}</b>`;
    frag.appendChild(el);
  }
  for (const n of N) {
    const el = document.createElement("div");
    el.className = "node" + (n.big ? " big" : "");
    el.tabIndex = 0;
    el.dataset.id = n.id;
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", `${n.t}: ${n.s}`);
    el.style.cssText = `left:${n.x}px;top:${n.y}px;--k:var(${CATS[n.c][1]})`;
    el.innerHTML = `${n.tag ? `<span class="tag">${n.tag}</span>` : ""}<div class="ic">${icon(n.ic)}</div>` +
      `<div class="tx"><b>${n.t}</b><span>${n.s}</span></div><i class="port l"></i><i class="port r"></i>`;
    frag.appendChild(el);
    nodeEl[n.id] = el;
    adj[n.id] = { nb: new Set(), edges: [] };
  }
  world.appendChild(frag);

  const legend = $("#legend");
  for (const [k, [label, v]] of Object.entries(CATS)) {
    if (k === "user" || k === "out") continue;
    const s = document.createElement("span");
    s.style.setProperty("--k", `var(${v})`);
    s.innerHTML = `<i></i>${label}`;
    legend.appendChild(s);
  }

  const DIR = { r: [1, 0], l: [-1, 0], t: [0, -1], b: [0, 1] };
  function port(id, side) {
    const { x, y, w, h } = geo[id];
    return { r: [x + w, y + h / 2], l: [x, y + h / 2], t: [x + w / 2, y], b: [x + w / 2, y + h] }[side];
  }
  const bez = (p, t) => { const u = 1 - t;
    return [0, 1].map((i) => u * u * u * p[0][i] + 3 * u * u * t * p[1][i] + 3 * u * t * t * p[2][i] + t * t * t * p[3][i]); };

  const edgeEls = [];
  function drawEdges() {
    clearHi();
    for (const n of N) { const el = nodeEl[n.id]; geo[n.id] = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; }
    edgeEls.length = 0;
    for (const id in adj) { adj[id].nb.clear(); adj[id].edges.length = 0; }
    let base = "", flows = "", labels = "";
    E.forEach(([a, b, sa, sb, label, dash], i) => {
      if (!geo[a] || !geo[b]) return;
      const [x1, y1] = port(a, sa), [x2, y2] = port(b, sb);
      const k = Math.max(60, Math.min(220, Math.hypot(x2 - x1, y2 - y1) * 0.45));
      const c1 = [x1 + DIR[sa][0] * k, y1 + DIR[sa][1] * k], c2 = [x2 + DIR[sb][0] * k, y2 + DIR[sb][1] * k];
      const d = `M${x1},${y1} C${c1} ${c2} ${x2},${y2}`;
      base += `<path class="e${dash ? " dash" : ""}" data-i="${i}" d="${d}" marker-end="url(#arr)"/>`;
      flows += `<path class="flow" data-i="${i}" d="${d}"/>`;
      if (label) {
        const [mx, my] = bez([[x1, y1], c1, c2, [x2, y2]], 0.5);
        labels += `<text class="elabel" data-i="${i}" x="${mx.toFixed(1)}" y="${(my - 6).toFixed(1)}" text-anchor="middle">${label}</text>`;
      }
    });
    svg.innerHTML = `<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">` +
      `<path d="M0,1 L9,5 L0,9 z" fill="#4a5568"/></marker></defs>${base}<g>${flows}</g>${labels}`;
    E.forEach(([a, b], i) => {
      if (!geo[a] || !geo[b]) return;
      const e = { a, b, path: svg.querySelector(`path.e[data-i="${i}"]`), flow: svg.querySelector(`path.flow[data-i="${i}"]`),
        text: svg.querySelector(`text[data-i="${i}"]`) };
      edgeEls.push(e);
      adj[a].nb.add(b); adj[b].nb.add(a); adj[a].edges.push(e); adj[b].edges.push(e);
    });
  }

  // ---------------------------------------------------------------- resaltado (solo toca lo que cambia)
  const state = { flow: null, sel: null, lit: new Set(), litEdges: new Set() };
  function clearHi() {
    world.classList.remove("dim");
    for (const id of state.lit) nodeEl[id].classList.remove("on", "sel");
    for (const e of state.litEdges) { e.path.classList.remove("on"); e.flow.classList.remove("on"); if (e.text) e.text.classList.remove("on"); }
    state.lit.clear(); state.litEdges.clear();
  }
  function highlight(ids, color, focus) {
    clearHi();
    world.classList.add("dim");
    for (const id of ids) { nodeEl[id].classList.add("on"); state.lit.add(id); }
    const list = focus ? adj[focus].edges : edgeEls.filter((e) => ids.has(e.a) && ids.has(e.b));
    const c = color || `var(${CATS[byId[focus].c][1]})`;
    for (const e of list) {
      e.path.classList.add("on"); e.path.style.setProperty("--hc", c);
      if (color) { e.flow.classList.add("on"); e.flow.style.setProperty("--hc", c); }
      if (e.text) e.text.classList.add("on");
      state.litEdges.add(e);
    }
  }

  // ---------------------------------------------------------------- panel de detalle
  const links = (ids) => `<div class="links">${ids.map((i) => `<button data-go="${i}">${byId[i].t}</button>`).join("")}</div>`;
  function openNode(id, center) {
    const n = byId[id];
    setFlow(null, true);
    state.sel = id;
    highlight(new Set([id, ...adj[id].nb]), null, id);
    nodeEl[id].classList.add("sel");
    const [cat, v] = CATS[n.c];
    const ins = E.filter((e) => e[1] === id).map((e) => e[0]);
    const outs = E.filter((e) => e[0] === id).map((e) => e[1]);
    dbody.innerHTML = `<div class="k" style="--k: var(${v})"><div class="ic">${icon(n.ic)}</div>` +
      `<div><div class="cat">${cat}</div><h2>${n.t}</h2></div></div><p>${n.d}</p>` +
      (n.l && n.l.length ? `<h3>Detalle</h3><ul>${n.l.map((x) => `<li>${x}</li>`).join("")}</ul>` : "") +
      (ins.length ? `<h3>Recibe de</h3>${links(ins)}` : "") + (outs.length ? `<h3>Envía a</h3>${links(outs)}` : "");
    drawer.classList.add("open");
    if (center) focusOn(id);
  }
  function openFlow(f) {
    dbody.innerHTML = `<div class="k" style="--k: var(${f.c})"><div class="ic">${icon("play")}</div>` +
      `<div><div class="cat">Recorrido</div><h2>${f.t}</h2></div></div>` +
      `<h3>Paso a paso</h3><ol>${f.steps.map((s) => `<li>${s}</li>`).join("")}</ol>` +
      `<h3>Nodos que participan</h3>${links(f.n.filter((i) => byId[i]))}`;
    drawer.classList.add("open");
  }
  dbody.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) openNode(b.dataset.go, true); });
  function closeDrawer() { drawer.classList.remove("open"); state.sel = null; setFlow(null); clearHi(); }
  $("#close").addEventListener("click", closeDrawer);

  const chipEls = {};
  const flowsBar = $("#flows");
  for (const f of FLOWS) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = f.t; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => setFlow(state.flow === f.k ? null : f.k));
    flowsBar.appendChild(b);
    chipEls[f.k] = b;
  }
  function setFlow(k, keepDrawer) {
    state.flow = k;
    for (const [key, b] of Object.entries(chipEls)) b.setAttribute("aria-pressed", String(key === k));
    if (!k) { if (!keepDrawer) { clearHi(); drawer.classList.remove("open"); } return; }
    state.sel = null;
    const f = FLOWS.find((x) => x.k === k);
    highlight(new Set(f.n.filter((i) => byId[i])), `var(${f.c})`);
    openFlow(f);
  }

  // Delegacion: un solo listener para todos los nodos.
  world.addEventListener("click", (e) => { const el = e.target.closest(".node"); if (el && moved < 4) { e.stopPropagation(); openNode(el.dataset.id); } });
  world.addEventListener("keydown", (e) => {
    const el = e.target.closest(".node");
    if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openNode(el.dataset.id); }
  });
  world.addEventListener("pointerover", (e) => {
    const el = e.target.closest(".node");
    if (!el || dragging || state.flow || state.sel || el === hovered) return;
    hovered = el; highlight(new Set([el.dataset.id, ...adj[el.dataset.id].nb]), null, el.dataset.id);
  });
  world.addEventListener("pointerout", (e) => {
    const el = e.target.closest(".node");
    if (!el || el.contains(e.relatedTarget) || dragging || state.flow || state.sel) return;
    hovered = null; clearHi();
  });
  let hovered = null;

  // ---------------------------------------------------------------- paneo y zoom (un repintado por cuadro)
  const view = { x: 0, y: 0, s: 1 };
  let raf = 0, idle = 0;
  function render() {
    raf = 0;
    world.style.transform = `translate3d(${view.x}px,${view.y}px,0) scale(${view.s})`;
    let cell = 22 * view.s;
    while (cell < 11) cell *= 2;
    const ox = ((view.x % cell) + cell) % cell, oy = ((view.y % cell) + cell) % cell;
    dots.style.backgroundSize = `${cell}px ${cell}px`;
    dots.style.transform = `translate3d(${ox - cell}px,${oy - cell}px,0)`;
  }
  function apply(interactive) {
    if (interactive) {
      stage.classList.add("moving");
      clearTimeout(idle);
      idle = setTimeout(() => stage.classList.remove("moving"), 160);  // al soltar, se vuelve a dibujar nitido
    }
    if (!raf) raf = requestAnimationFrame(render);
  }
  function zoomAt(f, cx, cy) {
    const s = Math.min(2.2, Math.max(0.15, view.s * f));
    view.x = cx - (cx - view.x) * (s / view.s);
    view.y = cy - (cy - view.y) * (s / view.s);
    view.s = s; apply(true);
  }
  const wide = () => stage.clientWidth > 640;
  function fit() {
    const w = stage.clientWidth, h = stage.clientHeight, top = wide() ? 60 : 8, pad = 20;
    view.s = Math.max(0.15, Math.min((w - pad * 2) / W, (h - top - pad) / H));
    view.x = (w - W * view.s) / 2;
    view.y = top + (h - top - H * view.s) / 2;
    apply();
  }
  function start() {
    if (wide()) return fit();
    view.s = 0.62; view.x = -4; view.y = 0; apply();  // en telefono empieza legible en los disparadores
  }
  function focusOn(id) {
    const g = geo[id], w = stage.clientWidth, h = stage.clientHeight;
    view.s = Math.max(view.s, 0.8);
    view.x = (w - (wide() ? 380 : 0)) / 2 - (g.x + g.w / 2) * view.s;
    view.y = (wide() ? h / 2 : h * 0.22) - (g.y + g.h / 2) * view.s;
    apply();
  }
  $("#zin").addEventListener("click", () => zoomAt(1.2, stage.clientWidth / 2, stage.clientHeight / 2));
  $("#zout").addEventListener("click", () => zoomAt(1 / 1.2, stage.clientWidth / 2, stage.clientHeight / 2));
  $("#zfit").addEventListener("click", fit);

  let rect = stage.getBoundingClientRect();
  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.ctrlKey || Math.abs(e.deltaX) < 1 || e.deltaMode) {
      zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - rect.left, e.clientY - rect.top);
    } else {  // panel tactil de laptop: dos dedos mueven el lienzo
      view.x -= e.deltaX; view.y -= e.deltaY; apply(true);
    }
  }, { passive: false });

  const pts = new Map();
  let last = null, moved = 0, pinch = null, dragging = false;
  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".drawer, .zoom, .legend")) return;
    rect = stage.getBoundingClientRect();
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) { last = [e.clientX, e.clientY]; moved = 0; }
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); }
  });
  stage.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoomAt(d / pinch, (a[0] + b[0]) / 2 - rect.left, (a[1] + b[1]) / 2 - rect.top);
      pinch = d; return;
    }
    if (!last) return;
    const dx = e.clientX - last[0], dy = e.clientY - last[1];
    moved += Math.abs(dx) + Math.abs(dy);
    if (!dragging && moved > 4) {
      dragging = true; stage.classList.add("dragging");
      try { stage.setPointerCapture(e.pointerId); } catch (_) { /* sin captura */ }
    }
    if (dragging) { view.x += dx; view.y += dy; last = [e.clientX, e.clientY]; apply(true); }
  });
  const up = (e) => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size) return;
    const wasClick = moved < 4;
    dragging = false; stage.classList.remove("dragging"); last = null;
    if (wasClick && !e.target.closest(".node, .drawer, .zoom, .legend")) closeDrawer();
  };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

  let ready = false;
  function init() { drawEdges(); if (!ready) { ready = true; start(); } }
  init();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawEdges);  // re-mide con la fuente final
  let rz = 0;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { rect = stage.getBoundingClientRect(); start(); }, 120); });
})();
</script>
</body>
</html>
